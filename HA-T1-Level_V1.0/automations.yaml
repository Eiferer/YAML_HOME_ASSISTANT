  - alias: "Update PV1 Max Ever Recorded"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.pv1_real_number
    condition:
      - condition: template
        value_template: "{{ states('sensor.pv1_real_number') | float(0) > states('input_number.pv1_max_ever') | float(0) }}"
    action:
      - service: input_number.set_value
        data:
          entity_id: input_number.pv1_max_ever
          value: "{{ states('sensor.pv1_real_number') | float(0) }}"
          
