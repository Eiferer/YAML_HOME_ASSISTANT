  - alias: "Accumulate Geyser Runtime"
    description: "Count time when geyser is on, geyser power is on, and battery > 98%"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"  # Runs every minute
    condition:
      - condition: state
        entity_id: switch.geyser
        state: "on"
      - condition: state
        entity_id: input_number.geyser_power
        above: 0
      - condition: numeric_state
        entity_id: input_number.battery
        above: 98
    action:
      - service: input_number.set_value
        data:
          entity_id: input_number.geyser_accumulated_time
          value: "{{ states('input_number.geyser_accumulated_time') | float(0) + 1 }}"