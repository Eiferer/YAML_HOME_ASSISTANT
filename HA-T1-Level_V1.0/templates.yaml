# Total PV Power
- sensor:
    - name: "PV Total"
      unit_of_measurement: "W"
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set pv1 = states(prefix ~ id ~ '_pv1_power') | float(0)  %}
        {% set pv2 = states(prefix ~ id ~ '_pv2_power') | float(0)  %}

        {{ pv1 + pv2 }}

        
# PV minus total power usage
- sensor:
    - name: "Power Difference"
      unit_of_measurement: "W"
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set pv = states('sensor.pv_total') | float %}
        {% set usage = states(prefix ~ id ~ '_load_totalpower') | float %}
        {{ pv - usage }}

#Battery SOC Value
- sensor:
    - name: "Solar Battery SOC"
      unique_id: solar_battery_soc
      unit_of_measurement: "%"
      state_class: measurement
      device_class: battery
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set soc = states(prefix ~ id ~ '_battery_soc') | float(0) %}
        {{ soc }}

#Invert Power Value
- sensor:
    - name: "Solar Inverter Power"
      unique_id: solar_inverter_power
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set inverter = states(prefix ~ id ~ '_load_totalpower') | float(0) %}
        {{ inverter }}
        
# Battery Voltage
- sensor:
    - name: "Battery Voltage"
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {{ states(prefix ~ id ~ '_battery_voltage') }}
      unit_of_measurement: "V"
      device_class: voltage
      
#Eskom Status
- sensor:
    - name: "Eskom Status"
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set grid_status = states(prefix ~ id ~ '_grid_connected_status') %}
        {% if grid_status == '1' %}
          on
        {% else %}
          off
        {% endif %}
        

# Power Difference Status based on sensor.power_difference and SOC        

- sensor:
    - name: "Power Difference Status"
      state: >
        {% set id = states('input_text.solar_device_id') %}
        {% set prefix = states('input_text.solar_prefix') %}
        {% set soc = states(prefix ~ id ~ '_battery_soc') | float %}
        {% set diff = states('sensor.power_difference') | float %}
        {% set high = states('input_number.pv_high') | float %}
        {% set med = states('input_number.pv_med') | float %}
        {% set low = states('input_number.pv_low') | float %}

        {% if soc >= 98 %}
          High
        {% elif diff > high %}
          High
        {% elif diff > (med + 200) %}
          Med-High
        {% elif diff > (med - 200) %}
          Med
        {% elif diff > low %}
          Med-Low
        {% else %}
          Low
        {% endif %}

#Template battery_time_to_limit
- sensor:
    - name: "Battery Time to Limit"
      unique_id: battery_time_to_limit
      unit_of_measurement: "hours"
      device_class: duration
      state_class: measurement
      state: >
        {% set soc = states('sensor.solar_battery_soc') | float(0) %}
        {% set voltage = states('sensor.battery_voltage') | float(0) %}
        {% set power_diff = states('sensor.power_difference') | float(0) %}
        {% set ah_capacity = 200 %}
        {% set capacity_kwh = (ah_capacity * voltage) / 1000 %}
        {% set max_soc = 100 %}
        {% set min_soc = 20 %}

        {% if soc > 0 and voltage > 0 and power_diff != 0 %}
          {% if power_diff > 0 %}
            {% set remaining_percent = max_soc - soc %}
            {% set remaining_kwh = (remaining_percent / 100) * capacity_kwh %}
            {% set hours_float = remaining_kwh / (power_diff / 1000) %}
            {{ hours_float | round(2) }}
          {% else %}
            {% set usable_percent = soc - min_soc %}
            {% if usable_percent < 0 %}
              0
            {% else %}
              {% set usable_kwh = (usable_percent / 100) * capacity_kwh %}
              {% set hours_float = usable_kwh / ((-1 * power_diff) / 1000) %}
              {{ hours_float | round(2) }}
            {% endif %}
          {% endif %}
        {% else %}
          unknown
        {% endif %}


#Internet down for how long
- sensor:
      - name: "Internet Downtime Hours"
        unit_of_measurement: "hours"
        state: >
          {% set c = states('counter.internet') | int(0) %}
          {{ (c / 4) | int }}

#Battery Time to Limit with Geyser Load
- sensor:
    - name: "Battery Time to Limit with geyser"
      unique_id: battery_time_to_limit_with_geyser
      unit_of_measurement: "hours"
      device_class: duration
      state_class: measurement
      state: >
        {% set soc = states('sensor.solar_battery_soc') | float(0) %}
        {% set voltage = states('sensor.battery_voltage') | float(0) %}
        {% set power_diff = states('sensor.power_difference') | float(0) %}
        {% set geyser_load = states('input_number.geysersize') | float(0) %}
        {% set net_power = power_diff - geyser_load %}
        {% set ah_capacity = 200 %}
        {% set capacity_kwh = (ah_capacity * voltage) / 1000 %}
        {% set max_soc = 100 %}
        {% set min_soc = 20 %}

        {% if soc > 0 and voltage > 0 and net_power != 0 %}
          {% if net_power > 0 %}
            {% set remaining_percent = max_soc - soc %}
            {% set remaining_kwh = (remaining_percent / 100) * capacity_kwh %}
            {% set hours_float = remaining_kwh / (net_power / 1000) %}
            {{ hours_float | round(2) }}
          {% else %}
            {% set usable_percent = soc - min_soc %}
            {% if usable_percent <= 0 %}
              -0
            {% else %}
              {% set usable_kwh = (usable_percent / 100) * capacity_kwh %}
              {% set hours_float = usable_kwh / ((-1 * net_power) / 1000) %}
              {{ (0 - hours_float) | round(2) }}
            {% endif %}
          {% endif %}
        {% else %}
          unknown
        {% endif %}







        
